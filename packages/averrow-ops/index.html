<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No-flash appearance bootstrap: applies data-theme / data-accent / data-base before
         first paint. The __APPEARANCE_*__ markers (and theme-color below) are filled at build
         time from packages/shared/src/theme/appearanceDefaults.ts (FACELIFT) by the
         appearanceHtml() Vite plugin (packages/shared/scripts/appearance-html.ts). Theme resolution
         sits outside the storage try/catch so blocked storage still gets the OS theme. -->
    <script>
      (function () {
        var ACCENTS = __APPEARANCE_ACCENTS__, BASES = __APPEARANCE_BASES__, DEFAULT_ACCENT = __APPEARANCE_DEFAULT_ACCENT__, DEFAULT_BASE = __APPEARANCE_DEFAULT_BASE__;
        var d = document.documentElement, t = null, a = null, b = null;
        try {
          var s = window.localStorage;
          t = s.getItem('averrow-theme'); a = s.getItem('averrow-accent'); b = s.getItem('averrow-base');
        } catch (e) { /* storage blocked: defaults below */ }
        if (t !== 'dark' && t !== 'light') {
          try { t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; } catch (e) { t = 'dark'; }
        }
        d.setAttribute('data-theme', t);
        if (ACCENTS.indexOf(a) < 0) a = DEFAULT_ACCENT;
        if (BASES.indexOf(b) < 0) b = DEFAULT_BASE;
        if (a) d.setAttribute('data-accent', a);
        if (b) d.setAttribute('data-base', b);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="__APPEARANCE_THEME_COLOR__" />
    <meta name="description" content="Threat actor intelligence platform — identify who, how, and where." />
    <link rel="icon" type="image/svg+xml" href="/v2/favicon.svg" />
    <link rel="apple-touch-icon" href="/v2/icon-192.svg" />
    <link rel="manifest" href="/v2/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Averrow" />
    <title>Averrow — Threat Interceptor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-cockpit text-parchment">
    <div id="root">
      <div id="app-loading" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'JetBrains Mono',monospace;font-size:13px;flex-direction:column;gap:12px">
        <div>Loading...</div>
        <div id="loading-timeout" style="opacity:0;visibility:hidden;animation:show-timeout 0.3s 8s forwards;text-align:center">
          <div class="app-loading-hint" style="font-size:11px;margin-bottom:8px">Taking longer than expected?</div>
          <a class="app-loading-link" href="/" style="font-size:12px;text-decoration:none">&larr; Return to homepage</a>
        </div>
      </div>
    </div>
    <style>
      @keyframes show-timeout { to { opacity: 1; visibility: visible; } }
      /* Pre-JS loading colours follow the theme the inline bootstrap set
         (literals: the app stylesheet may not have loaded yet). Dark = the
         original values; light = readable dark text on the light page. */
      #app-loading { color: rgba(255,255,255,0.4); }
      #app-loading .app-loading-hint { color: rgba(255,255,255,0.3); }
      #app-loading .app-loading-link { color: #00d4ff; }
      [data-theme="light"] #app-loading { color: rgba(15,20,35,0.62); }
      [data-theme="light"] #app-loading .app-loading-hint { color: rgba(15,20,35,0.62); }
      [data-theme="light"] #app-loading .app-loading-link { color: #155e75; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
