<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No-flash appearance bootstrap: applies data-theme / data-accent / data-base before
         first paint. The ACCENTS/BASES/DEFAULT_* literals MUST equal those exported by
         packages/shared/src/theme/useAppearance.ts (a test enforces it). Theme resolution
         sits outside the storage try/catch so blocked storage still gets the OS theme. -->
    <script>
      (function () {
        var ACCENTS = ['indigo', 'violet', 'mono', 'lime'], BASES = ['graphite', 'navy'], DEFAULT_ACCENT = null, DEFAULT_BASE = null;
        var d = document.documentElement, t = null, a = null, b = null;
        try {
          var s = window.localStorage;
          t = s.getItem('averrow-theme'); a = s.getItem('averrow-accent'); b = s.getItem('averrow-base');
        } catch (e) { /* storage blocked: defaults below */ }
        if (t !== 'dark' && t !== 'light') {
          try { t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; } catch (e) { t = 'dark'; }
        }
        d.setAttribute('data-theme', t);
        if (ACCENTS.indexOf(a) < 0) a = DEFAULT_ACCENT;
        if (BASES.indexOf(b) < 0) b = DEFAULT_BASE;
        if (a) d.setAttribute('data-accent', a);
        if (b) d.setAttribute('data-base', b);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060A14" />
    <meta name="description" content="Threat actor intelligence platform — identify who, how, and where." />
    <link rel="icon" type="image/svg+xml" href="/v2/favicon.svg" />
    <link rel="apple-touch-icon" href="/v2/icon-192.svg" />
    <link rel="manifest" href="/v2/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Averrow" />
    <title>Averrow — Threat Interceptor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-cockpit text-parchment">
    <div id="root">
      <div id="app-loading" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,0.4);font-size:13px;flex-direction:column;gap:12px">
        <div>Loading...</div>
        <div id="loading-timeout" style="opacity:0;visibility:hidden;animation:show-timeout 0.3s 8s forwards;text-align:center">
          <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:8px">Taking longer than expected?</div>
          <a href="/" style="color:#00d4ff;font-size:12px;text-decoration:none">&larr; Return to homepage</a>
        </div>
      </div>
    </div>
    <style>
      @keyframes show-timeout { to { opacity: 1; visibility: visible; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
