name: Tag release

# Creates the vX.Y.Z tag for a platform version as soon as it lands on
# master (CLAUDE.md §9b / §9a). platform-version.json is the source of
# truth: when a merge changes it, the merge commit that brought the change
# onto master is tagged — unless that tag already exists. Idempotent, so a
# re-run or an unrelated push never moves or duplicates a tag.

on:
  push:
    branches: [master]
    paths:
      - "platform-version.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag platform version
    # Release tags only ever point at master. A manual run started from
    # another branch is refused rather than tagging an unmerged commit.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Create tag if missing
        run: |
          set -euo pipefail
          version=$(jq -r '.version' platform-version.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::platform-version.json version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists at $(git rev-list -n1 "$tag"); nothing to do."
            exit 0
          fi
          # The oldest first-parent commit on master that carries this version
          # (the merge commit that introduced it for a merged PR), walking back
          # only through commits that touched the version file.
          target=""
          for c in $(git log --first-parent --format=%H -- platform-version.json); do
            v=$(git show "$c:platform-version.json" | jq -r '.version')
            if [ "$v" = "$version" ]; then target="$c"; else break; fi
          done
          if [ -z "$target" ]; then
            echo "::error::no commit on master carries version $version"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$target" -m "$tag"
          git push origin "refs/tags/$tag"
          echo "Tagged $tag at $target"
