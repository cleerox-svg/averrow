name: CI — All Packages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-workers:
    name: TypeCheck Workers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [averrow-worker]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: packages/${{ matrix.package }}
        run: pnpm typecheck

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: pnpm test
        if: matrix.package == 'averrow-worker'

      # Phase 4.3 drift CI gate — fails when an agent's declared
      # `reads` / `writes` diverge from the architect manifest's static
      # SQL extraction. Forces the per-module declarations and the
      # actual file content to stay in sync as agents evolve.
      - name: Resource declaration drift check
        working-directory: packages/${{ matrix.package }}
        run: pnpm build:manifest && pnpm check:resource-drift
        if: matrix.package == 'averrow-worker'

      # Phase 5.2 AGENT_STANDARD §22 enforcement — cross-file
      # consistency rules the TS compiler can't verify (metadata
      # parity, icon coverage, group membership, pipelinePosition
      # uniqueness, exempt justifications, doc coverage). Companion
      # to the resource-drift check above.
      - name: AGENT_STANDARD §22 audit
        working-directory: packages/${{ matrix.package }}
        run: pnpm audit:agent-standard
        if: matrix.package == 'averrow-worker'

  test-react-ui:
    name: Test React UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run React UI tests
        working-directory: packages/averrow-ops
        run: pnpm test

  # Gates the averrow-ops SPA on `tsc --noEmit`, matching the Workers
  # typecheck. Previously the SPA had no typecheck in CI, so type
  # regressions could ship as long as vitest stayed green.
  typecheck-ui:
    name: TypeCheck UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: packages/averrow-ops
        run: pnpm typecheck

  # ── averrow-tenant (customer-facing SPA) ──────────────────────────
  #
  # This package had NO CI coverage at all: the three jobs above gate
  # averrow-worker and averrow-ops only, so the customer-facing SPA's
  # tests and typecheck ran solely on a contributor's machine. Lane 3
  # Phase 3 was the point that became untenable — it put real logic
  # there (PageVerdictChip, lib/pageSignals.ts, PageAnalysisDialog)
  # behind that ungated door, and three consecutive PRs (#1714, #1715,
  # #1717) touched the package with nothing verifying them remotely.
  #
  # Deliberately two separate jobs mirroring the averrow-ops pair rather
  # than adding averrow-tenant to a matrix on those jobs: a matrix would
  # rename the existing checks ("Test React UI" → "Test React UI
  # (averrow-ops)"), which silently breaks any branch-protection rule
  # requiring the current name. Additive jobs cannot.
  test-tenant-ui:
    name: Test Tenant UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tenant UI tests
        working-directory: packages/averrow-tenant
        run: pnpm test

  typecheck-tenant-ui:
    name: TypeCheck Tenant UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: packages/averrow-tenant
        run: pnpm typecheck

  # ── averrow-marketing (Astro site, averrow.com /) ─────────────────
  #
  # Facelift Phase 5. The marketing site had no CI: its Playwright
  # suite and `astro check` ran only on a contributor's machine, and
  # deploy-radar.yml only builds it. This job typechecks, builds,
  # serves the build with `astro preview` and runs the Playwright
  # suite (desktop chromium project), including the homepage
  # performance budgets in tests/perf-budget.spec.ts.
  #
  # Path-filtered inside the job (ci.yml has no workflow-level `paths`,
  # and one would gate every other job too): the first step diffs the
  # change against its base and the remaining steps are skipped when
  # nothing under packages/averrow-marketing/ or this workflow moved.
  # The job still reports success, so it can be a required check.
  #
  # No secrets and no prod dependency: `build:ci` is `astro build` +
  # the sitemap generator only. It skips scripts/fetch-stats.mjs (the
  # live stats fetch, so the build uses the committed
  # src/data/stats.json and stays deterministic) and
  # scripts/sync-to-worker.mjs (deploy-only copy into the Worker).
  marketing:
    name: Marketing Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/averrow-marketing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect marketing changes
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          # New branch / force-push / unknown base: run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No usable base ($base); running the marketing job."
            exit 0
          fi
          if git diff --name-only "$base"...HEAD -- \
               packages/averrow-marketing .github/workflows/ci.yml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No marketing changes since $base; skipping."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.run == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # The browser version is pinned by the lockfile's @playwright/test.
      - name: Install Playwright Chromium
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Astro check
        if: steps.changes.outputs.run == 'true'
        run: pnpm typecheck

      - name: Astro build (no stats fetch, no worker sync)
        if: steps.changes.outputs.run == 'true'
        run: pnpm run build:ci

      - name: Start astro preview
        if: steps.changes.outputs.run == 'true'
        run: |
          nohup pnpm exec astro preview --port 4321 --host 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4321/; then
              echo "preview up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::astro preview did not start"; cat "$RUNNER_TEMP/preview.log"; exit 1

      # PLAYWRIGHT_BASE_URL makes playwright.config.ts skip its own
      # webServer (which would run the full deploy build).
      - name: Playwright (chromium, incl. perf budgets)
        if: steps.changes.outputs.run == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4321
        run: pnpm exec playwright test --project=chromium

      - name: Upload Playwright report
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marketing-playwright-report
          path: |
            packages/averrow-marketing/playwright-report
            packages/averrow-marketing/test-results
          retention-days: 7
