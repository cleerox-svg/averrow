<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Averrow hero H4A: Auto-play steps</title>
<link rel="preload" href="fonts/geist-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<script>if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("lv")</script>
<style>
/*BASE*/
:root{--ease:cubic-bezier(.2,0,0,1)}
.hero{max-width:1200px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:16px;align-items:center;min-height:min(820px,calc(100svh - 72px))}
.hero-copy{padding:24px 0}
.stage{position:relative;width:calc(100% + 56px)}.g{position:relative;aspect-ratio:760/620}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas{opacity:0;transition:opacity .5s}
.stage.live canvas{opacity:1}.stage.live .poster{opacity:0;transition:opacity .5s}
.poster text{font-family:var(--mono);font-size:11px;fill:var(--text-2);font-feature-settings:"calt" 0;paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.poster .sub{fill:var(--muted)}
.poster .ttl{font-family:var(--sans);font-weight:600;font-size:15px;fill:var(--text)}
.poster .hubt{fill:var(--primary-text);font-size:13px;font-weight:500;stroke:none}
.poster .hubt+.sub{stroke:none}
.tk{position:absolute;right:70px;bottom:10px;width:min(284px,62%);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px 11px}
.tk-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;margin-bottom:8px}
.tk-t{height:6px;border-radius:3px;background:var(--line-2);display:flex;overflow:hidden}
.tk-t i{display:block;height:100%}
.tk-n{display:flex;gap:10px;margin-top:9px;font-size:12px;color:var(--text-2);white-space:nowrap}
.tk-n b{font-weight:500;color:var(--text)}
.ill{position:absolute;top:2px;right:56px;font-size:11px;color:var(--muted);margin:0}
.rail{display:none}
.sl{grid-column:1/-1;list-style:none;margin:0;padding:18px 0 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;counter-reset:s}
.sl li{border-top:1px solid var(--line-2);padding-top:10px;counter-increment:s}
.sl b{display:block;font-weight:500;font-size:15px}.sl b::before{content:counter(s) "  ";font-family:var(--mono);color:var(--primary-text);font-size:12px}
.sl span{display:block;font-size:13px;line-height:1.5;color:var(--text-2);margin-top:4px}
html.lv .sl{display:none}html.lv .rail{display:block}
.rt{display:flex;align-items:flex-start;gap:8px}
.rt ol{list-style:none;margin:0;padding:0;display:flex;gap:10px;flex:1;min-width:0}.rt li{flex:1;min-width:0}
.sb{all:unset;box-sizing:border-box;position:relative;display:block;width:100%;padding:8px 0 0;font:500 12.5px/18px var(--sans);color:var(--muted);cursor:pointer;transition:color .12s var(--ease);white-space:nowrap}
.sb::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--line-2);border-radius:1px}
.sb .fl{position:absolute;top:0;left:0;right:0;height:2px;border-radius:1px;background:var(--primary-text);transform:scaleX(1);transform-origin:left}
.sb[aria-current=step]{color:var(--text)}.sb:hover{color:var(--text-2)}.sb[aria-current=step]:hover{color:var(--text)}
.sb:focus-visible,.pp:focus-visible{outline:2px solid var(--primary-text);outline-offset:3px;border-radius:3px}
.sb .lg{display:none}
.pp svg{position:static;width:12px;height:12px}
.pp{all:unset;box-sizing:border-box;width:28px;height:26px;margin-top:2px;display:grid;place-items:center;color:var(--text-2);cursor:pointer;border-radius:6px;flex:none}
.pp:hover{color:var(--text);background:var(--primary-tint)}.pp svg{display:block}.pp .i-play{display:none}.pp[aria-pressed=true] .i-play{display:block}.pp[aria-pressed=true] .i-pause{display:none}
.cap{margin:3px 36px 0 0;font-size:12.5px;line-height:16px;color:var(--text-2);transition:opacity .12s var(--ease)}.cap.sw{opacity:0}
@media (min-width:900px){
html.lv .rail{position:absolute;left:0;right:56px;bottom:0;padding:16px 0 0;background:linear-gradient(to top,var(--bg) 70%,rgba(10,11,14,0))}
html.lv .tk{bottom:52px;width:250px;padding:8px 12px 9px}html.lv .tk-h{margin-bottom:6px}html.lv .tk-n{margin-top:7px}
.cap{display:none}
}
@media (min-width:1120px){.sb .lg{display:inline}.sb .sh{display:none}.cap{display:block}}
@media (max-width:899px){
.hero{grid-template-columns:1fr;min-height:0;padding-bottom:8px;gap:0}
.stage{margin:6px 0 0!important;max-width:520px;width:100%;display:flex;flex-direction:column}.g{aspect-ratio:390/340;order:0}
.rail{order:1;padding:10px 0 0}.ill{order:2;position:static;margin:6px 0 0}.tk{order:3;position:relative;right:auto;bottom:auto;width:100%;margin:10px 0 12px}
.sb{padding:11px 0 8px}.pp{margin-top:4px}
.cap{display:block;margin:2px 0 0}
.sl{grid-template-columns:1fr 1fr;gap:16px}
}
@media (prefers-reduced-motion:reduce){.stage canvas{display:none}}
</style></head><body>
<!--NAV-->
<main><section class="hero" aria-labelledby="hero-title">
<div class="hero-copy"><!--COPY--></div>
<figure class="stage" id="stage" style="margin-block:0" aria-labelledby="cap">
<!--FIGCAP-->
<div class="g" id="g"><!--POSTERS--><canvas id="cv" aria-hidden="true"></canvas></div>
<div class="rail" id="rail" role="group" aria-label="Operation steps"><div class="rt"><ol><!--RAILBTNS--></ol><button type="button" class="pp" aria-pressed="false" aria-label="Pause step animation"><svg class="i-pause" width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1.5" width="2.8" height="9" rx=".6"/><rect x="7.2" y="1.5" width="2.8" height="9" rx=".6"/></svg><svg class="i-play" width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M3 1.6v8.8L10.4 6z"/></svg></button></div>
<p class="cap">Takedowns filed for each domain under your authorization; status updates as hosts act.</p></div>
<!--CARD-->
<p class="ill">Illustrative example · names changed</p>
</figure>
<!--SL-->
</section></main>
<style>.stage .poster-m{display:none}@media (max-width:620px){.stage .poster-d{display:none}.stage .poster-m{display:block}}</style>
<script>/*CORE*/</script><script>/*RUN*/</script>
</body></html>
